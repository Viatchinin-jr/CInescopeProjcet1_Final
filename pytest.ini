[pytest]
log_cli = 1
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S

markers=
    slow: slow tests
    api: все тесты API
    movies: тесты модуля фильмов
    smoke: критически важные тесты
    regression: полная проверка функциональности
    positive: позитивные сценарии
    negative: тесты на обработку ошибок
    slow: долгие тесты
    db: тесты БД


